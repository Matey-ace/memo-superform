  <h1>Memo Superform</h1>
  <p>Memo Superform 是一款本地运行的学习数据仪表盘：经用户主动连接后读取学习进度、学习记录和云词本，用于本机统计、图表与复习提醒。</p>
  <p>桌面应用使用墨墨开放平台的 OAuth 授权。授权令牌只保存于用户电脑的 Windows 加密凭据中；学习数据默认只存于本地 SQLite，可在应用设置中断开连接或删除本机学习数据。</p>
  <p>应用还包含本地嵌入式学习页、可选 Live2D 与语音陪伴功能。它们不代表墨墨官方产品或服务。</p>
  <p><a href="privacy.html">隐私说明</a> · <a href="https://github.com/Matey-ace/memo-superform">项目主页</a></p>
